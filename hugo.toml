baseURL = 'https://electric.ygking.top/'
title = '电工学习笔记'
theme = 'hugo-book'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

# “最后修改”链接依赖每条内容的最近一次提交
enableGitInfo = true

[params]
  # light | dark | auto（跟随系统）；另有 contrast-*、catppuccin-*、ayu-* 配色
  BookTheme = 'light'
  BookSection = 'docs'
  BookSearch = true
  BookBreadcrumbs = true
  BookDateFormat = '2006-01-02'
  BookRepo = 'https://github.com/tooplick/StudyNote'
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/master/{{ .Path }}'

# Required for mermaid and katex shortcodes
[markup.goldmark.renderer]
  unsafe = true

# 侧边栏底部的导航
[[menu.after]]
  name = 'docs'
  pageRef = '/docs/'
  weight = 10
[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/tooplick/StudyNote'
  weight = 20
